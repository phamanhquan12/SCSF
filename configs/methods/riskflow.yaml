# RiskFlow default: residual innovation + sample-dependent gates, hard + soft
# channels. Inference score is the error-risk channel (confidence = -s_hard_L).
# The soft difficulty channel is a persistent but auxiliary training signal
# (excluded from deployment parameter counts).
default_score: riskflow
method:
  score: riskflow
  mode: riskflow
  use_soft: true
  freeze_backbone: false
  state_dim: 64
  cell_hidden: 64
  token: cls
  # One dataset-independent auxiliary scale. The recurrent stack contributes
  # four supervised terms, so 0.1 keeps it a regularizer under the shared
  # CCL-SC SGD protocol rather than overwhelming the primary CE objective.
  innov_scale: 0.1
  term_scale: 0.1
  decorr_scale: 0.001
  huber_delta: 1.0
  cat_lo: 0.3
  cat_hi: 0.7
citation: RiskFlow default - accumulate conditional failure innovations (residual innovation + sample-dependent gates)
