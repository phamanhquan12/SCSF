# DepthFrag ablation 6: distilled score with FROZEN backbone (control). The
# probe/head capacity is identical to depthfrag.yaml; only the backbone is
# frozen, so probe gradients cannot shape the representation. Comparing this to
# the end-to-end variant decides whether deep supervision helped.
default_score: depthfrag
method:
  score: depthfrag
  p: 2
  q: 2
  eps: 1e-12
  bn_mode: eval_targets
  token: cls
  probe_sites: all
  terminal_site: top_l1
  agg: soft_min
  agg_tau: 2.0
  cvar_frac: 0.25
  target: signed_log1p
  probe_hidden: 32
  probe_scale: 1.0
  head_scale: 1.0
  huber_delta: 1.0
  use_probes: true
  use_head: true
  freeze_backbone: true
citation: DepthFrag distilled score, frozen-backbone control