# DepthFrag ablation 4: raw full-depth profile. Probes at every site; the depth
# profile is used in full (mean aggregation) and the terminal head distills the
# detached aggregate of the entire per-site profile.
default_score: depthfrag
method:
  score: depthfrag
  p: 2
  q: 2
  eps: 1e-12
  bn_mode: eval_targets
  token: cls
  probe_sites: all
  terminal_site: top_l1
  agg: mean             # full-profile aggregation (raw depth profile summarized)
  target: signed_log1p
  probe_hidden: 32
  probe_scale: 1.0
  head_scale: 1.0
  huber_delta: 1.0
  use_probes: true
  use_head: true
  freeze_backbone: false
citation: DepthFrag ablation - raw full-depth profile (mean aggregate)