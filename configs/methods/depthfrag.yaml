# DepthFrag default: distilled terminal score, end-to-end (probes + head shape
# the backbone through the depth targets). Inference keeps terminal logits plus
# the small terminal fragility head only; probes are training instruments.
default_score: depthfrag
method:
  score: depthfrag
  p: 2
  q: 2
  eps: 1e-12
  bn_mode: eval_targets   # separate target forward, BatchNorm frozen/eval stats
  token: cls
  probe_sites: all
  terminal_site: top_l1
  agg: soft_min           # soft-min across the depth profile
  agg_tau: 2.0
  cvar_frac: 0.25
  target: signed_log1p    # sign(rel_r) * log1p(|rel_r|)
  clip_cap: 1.0
  probe_hidden: 32
  probe_scale: 1.0
  head_scale: 1.0
  huber_delta: 1.0
  use_probes: true
  use_head: true
  freeze_backbone: false
  target_interval: 1      # 1 = recompute eval-forward targets every step
citation: DepthFrag distilled terminal score, e2e (probe loss shapes the backbone)