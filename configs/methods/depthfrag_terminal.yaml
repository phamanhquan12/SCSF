# DepthFrag ablation 2: terminal normalized radius only. A single probe at the
# terminal site (top_l1) and the terminal fragment of the depth profile; the
# terminal head distills the detached terminal radius.
default_score: depthfrag
method:
  score: depthfrag
  p: 2
  q: 2
  eps: 1e-12
  bn_mode: eval_targets
  token: cls
  probe_sites: [top_l1]
  terminal_site: top_l1
  agg: terminal
  target: signed_log1p
  probe_hidden: 32
  probe_scale: 1.0
  head_scale: 1.0
  huber_delta: 1.0
  use_probes: true
  use_head: true
  freeze_backbone: false
citation: DepthFrag ablation - terminal normalized radius