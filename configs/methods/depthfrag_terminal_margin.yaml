# DepthFrag ablation 1: terminal true-class margin only (no probes, no head).
# Reduces to the CE baseline whose confidence score is the logit margin.
default_score: logit_margin
method:
  score: logit_margin
  p: 2
  q: 2
  eps: 1e-12
  bn_mode: eval_targets
  use_probes: false
  use_head: false
  freeze_backbone: false
citation: DepthFrag ablation - terminal true-class margin only