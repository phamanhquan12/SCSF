# DepthFrag ablation 7: absolute/clipped radius sensitivity control. Targets
# use log1p(|relative_rho|) (absolute), erasing the signed correct/incorrect
# distinction; the terminal head must predict magnitude only. Same capacity and
# backbone treatment as the default run.
default_score: depthfrag
method:
  score: depthfrag
  p: 2
  q: 2
  eps: 1e-12
  bn_mode: eval_targets
  token: cls
  probe_sites: all
  terminal_site: top_l1
  agg: soft_min
  agg_tau: 2.0
  cvar_frac: 0.25
  target: absolute       # sensitivity control: absolute radius magnitude
  clip_cap: 1.0
  probe_hidden: 32
  probe_scale: 1.0
  head_scale: 1.0
  huber_delta: 1.0
  use_probes: true
  use_head: true
  freeze_backbone: false
citation: DepthFrag ablation - absolute/clipped radius sensitivity control